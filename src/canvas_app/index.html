<!doctype html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THAUMWORLD Mono UI (Canvas)</title>

    <style>
        @font-face {
            font-family: 'Thaum Mono';
            src: url('../../fontbook/ThaumMono-W80.ttf') format('truetype');
            font-style: normal;
            font-weight: 80;
        }

        @font-face {
            font-family: 'Thaum Mono';
            src: url('../../fontbook/ThaumMono-W160.ttf') format('truetype');
            font-style: normal;
            font-weight: 160;
        }

        @font-face {
            font-family: 'Thaum Mono';
            src: url('../../fontbook/ThaumMono-W320.ttf') format('truetype');
            font-style: normal;
            font-weight: 320;
        }

        @font-face {
            font-family: 'Thaum Mono';
            src: url('../../fontbook/ThaumMono-W640.ttf') format('truetype');
            font-style: normal;
            font-weight: 640;
        }

        :root {
            --ui-scale: 1;
            --pan-x: 0px;
            --pan-y: 0px;
            --tile-w: 12px;
            --tile-h: 16px;
            --ui-background: #120a1a;
            --ui-dimmest-rgb: 42, 42, 65;

            /* Background dot grid: tied to canvas pan + tile size. */
            --dot-step-mult: 1;
            --dot-r: 1.2px;
        }

        html,
        body {
            margin: 0;
            height: 100%;
            background-color: var(--ui-background);
            overflow: hidden;
        }

        #root {
            height: 100%;
            width: 100%;
            overflow: hidden;
            position: relative;
            display: block;
        }

        #bg_dots {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background-image: radial-gradient(circle,
                    rgba(var(--ui-dimmest-rgb), 0.42) 0,
                    rgba(var(--ui-dimmest-rgb), 0.42) calc(var(--dot-r) * var(--ui-scale)),
                    transparent calc((var(--dot-r) + 0.8px) * var(--ui-scale)));

            /* Move WITH the canvas (and lock step to tile sizes). */
            background-position: var(--pan-x) var(--pan-y);
            background-size: calc(var(--tile-w) * var(--dot-step-mult)) calc(var(--tile-h) * var(--dot-step-mult));
        }

        canvas {
            image-rendering: pixelated;
            position: absolute;
            left: 0;
            top: 0;
            will-change: transform;
            filter: url(#uiTextureDeform);
        }

        /* Voxel Layer Container */
        #voxel_layers_container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            overflow: hidden;
        }

        /* Individual Voxel Layer Canvases */
        .voxel-layer {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: center center;
            will-change: transform;
            image-rendering: pixelated;
            pointer-events: none;
        }

        /* UI Layer (mono_canvas) should be above voxel layers */
        #mono_canvas {
            z-index: 10;
        }
    </style>
</head>

<body>
    <div id="root">
        <div id="bg_dots" aria-hidden="true"></div>
        <div id="voxel_layers_container"></div>
        <canvas id="mono_canvas"></canvas>
    </div>

    <!-- SVG filter for texture deformation (2-pass turbulence displacement).
         Strength/frequency are tuned at runtime based on UI scale in src/canvas_app/main.ts. -->
    <svg width="0" height="0" style="position: absolute; left: -9999px; top: -9999px;">
        <filter id="uiTextureDeform"
                x="-20%" y="-20%" width="140%" height="140%"
                color-interpolation-filters="sRGB"
                primitiveUnits="userSpaceOnUse">

            <!-- A) Wobble: large kernels (~5-10 glyphs), paper breathing -->
            <feTurbulence id="uiNoiseWobble"
                          type="fractalNoise"
                          baseFrequency="0.0065"
                          numOctaves="1"
                          seed="11"
                          result="noiseWobble" />
            <feOffset id="uiOffsetWobble" in="noiseWobble" dx="0" dy="0" result="noiseWobbleShift" />
            <feDisplacementMap id="uiDispWobble"
                               in="SourceGraphic"
                               in2="noiseWobbleShift"
                               scale="7.5"
                               xChannelSelector="R"
                               yChannelSelector="G"
                               result="wobbled" />

            <!-- B) Texture: smaller kernels (edge texture) -->
            <feTurbulence id="uiNoiseTexture"
                          type="fractalNoise"
                          baseFrequency="0.11"
                          numOctaves="2"
                          seed="23"
                          result="noiseTexture" />
            <feOffset id="uiOffsetTexture" in="noiseTexture" dx="0" dy="0" result="noiseTextureShift" />
            <feDisplacementMap id="uiDispTexture"
                               in="wobbled"
                               in2="noiseTextureShift"
                               scale="4"
                               xChannelSelector="R"
                               yChannelSelector="G" />
        </filter>
    </svg>

    <textarea id="key_sink"
              autocapitalize="off"
              autocomplete="off"
              autocorrect="off"
              spellcheck="false"
              style="
    position: fixed;
    left: -10000px;
    top: 0;
    width: 1px;
    height: 1px;
    opacity: 0;
  "></textarea>

    <script type="module" src="./bootstrap.ts"></script>



</body>
</html>
